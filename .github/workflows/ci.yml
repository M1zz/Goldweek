name: CI

# 로컬에서만 돌던 게이트(scripts/predeploy.sh — 빌드 + 단위 시험)를 푸시·PR 마다 자동으로 돌린다.
# 게이트 로직은 predeploy.sh 한 곳에만 둔다 — 여기서 명령을 복제하면 로컬과 CI 가 갈라진다.
#
# ⚠️ GoldweekSecrets.swift 는 .gitignore 라 러너에는 없다. 예제 파일로 채워 빌드만 되게 한다
#    (실제 키가 필요한 여행 추천 호출은 시험에서 부르지 않는다).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 빌드 · 단위 시험
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전 확인
        run: xcodebuild -version

      # LeeoKit(공개 SPM 패키지)을 매번 새로 받지 않도록 캐시.
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 비밀값 자리 채우기
        run: |
          if [ ! -f Goldweek/GoldweekSecrets.swift ]; then
            cp Goldweek/GoldweekSecrets.example.swift Goldweek/GoldweekSecrets.swift
          fi

      - name: 게이트 실행 (predeploy.sh)
        run: sh scripts/predeploy.sh

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    # ⚠️ 처음에는 막지 않는다 — 남은 경고(try! 10건 · 긴 파일 1개)를 0 으로 만든 뒤 이 줄을 지운다.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint 설치
        run: brew install swiftlint

      - name: SwiftLint 실행
        run: swiftlint --strict
