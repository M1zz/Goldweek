<script>
// 브라우저 언어에 맞는 소개 페이지로 보낸다. 없으면 영어.
(function () {
  var supported = ["ko", "en", "de", "es", "fr", "it", "ja", "pt-BR", "zh-Hans", "zh-Hant", "ru", "id", "nl", "sv", "nb", "da", "fi", "pl", "cs", "el", "tr", "th", "vi"];
  function pick(tag) {
    var t = String(tag || "").toLowerCase();
    if (/^zh-(tw|hk|mo|hant)/.test(t)) return "zh-Hant";
    if (/^zh/.test(t)) return "zh-Hans";
    if (/^pt/.test(t)) return "pt-BR";
    if (/^(nb|no|nn)/.test(t)) return "nb";
    var p = t.split("-")[0];
    for (var i = 0; i < supported.length; i++) if (supported[i].toLowerCase() === p) return supported[i];
    return null;
  }
  var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
  for (var i = 0; i < prefs.length; i++) {
    var l = pick(prefs[i]);
    if (l) { location.replace(l + "/" + location.hash); return; }
  }
  location.replace("en/" + location.hash);
})();
</script>
